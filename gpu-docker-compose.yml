services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: rag-gpu-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"

  ollama-init:
    image: ollama/ollama:0.9.5
    container_name: rag-gpu-ollama-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do
      echo 'Waiting for host Ollama at $${OLLAMA_HOST}...';
      sleep 2;
      done &&
      ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} &&
      ollama pull ${LLM_MODEL:-llama3.2:3b}"
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-gpu-backend
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama-init
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: rag_memory
      OLLAMA_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      HYBRID_ALPHA: ${HYBRID_ALPHA:-0.7}
    extra_hosts:
      - "host.docker.internal:host-gateway"
